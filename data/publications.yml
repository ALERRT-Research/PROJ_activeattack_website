# Work that used the Active Attack Data (or the ALERRT active shooter event
# data it grew from). Rendered by R/publications.R on publications.qmd.
#
# One entry per work. Fields:
#   type:    article | report | book | chapter | other
#   year, authors, title, venue (journal, publisher or series)
#   doi (preferred) or url
#   uses:    one line on how the work used the data (shown in muted text)
#   by:      alerrt (default) | others   -- work by researchers outside ALERRT
# Newest first within a type is handled by the renderer; order here is free.
# Started 2026-11-09 from the ALERRT publications list (shared drive,
# published_articles/1_ALERRT_publications.docx) and alerrtresearch.org.

- type: article
  year: 2025
  authors: "Blair, J. P., Martaindale, M. H., Tanksley, P. T., & Johncox, J. D."
  title: "Active attacks with motor vehicles: A short report and case study of the 2025 New Year's Day attack in New Orleans, LA"
  venue: "American Journal of Criminal Justice"
  doi: "10.1007/s12103-025-09806-x"
  uses: "Every vehicle attack in the data, 2000 to 2025, beside the New Orleans case."

- type: article
  year: 2022
  authors: "Blair, J. P., & Duron, A."
  title: "How police officers are shot and killed during active shooter events: Implications for response and training"
  venue: "The Police Journal: Theory, Practice and Principles"
  doi: "10.1177/0032258X221087827"
  uses: "Officers shot during active shooter events, identified from the event data."

- type: article
  year: 2022
  authors: "Sandel, W. L., & Martaindale, M. H."
  title: "What are we talking about? Definitional confusion within active and mass shooting research"
  venue: "Journal of Mass Violence Research"
  doi: "10.53076/JMVR47829"
  uses: "Shows how the active attack definition differs from the mass shooting definitions in use, and what each one counts."

- type: article
  year: 2021
  authors: "Duron, A."
  title: "\"Shots fired! We have many people down!\": Common recommendations for managing high-casualty active shooter events in the USA"
  venue: "International Journal of Disaster Risk Reduction"
  doi: "10.1016/j.ijdrr.2021.102548"
  uses: "High-casualty events drawn from the data."

- type: article
  year: 2020
  authors: "Blair, J. P., Sandel, W. L., & Martaindale, M. H."
