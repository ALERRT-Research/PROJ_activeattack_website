project:
  type: website
  # only the .qmd pages; bob.md (internal status card) was being published as bob.html
  render:
    - "*.qmd"
  resources: 
  - "CNAME"
  - "www/"        # figures, maps, video; every page may link into it
  
website:
  title: "Active Attack Data Explorer"
  navbar:
    tools:
    logo: "www/alerrt_banner.png"
    right:
      - href: index.qmd #this needs to stay "index.qmd" to be recognized as the landing page
        text: Home
      - href: 1_visuals.qmd
        text: Active Attacks
      - href: publications.qmd
        text: Publications
      - href: 2_victims.qmd
        text: Remembrance
      - href: 3_contact.qmd
        text: Contact
  page-footer: 
    left: "Created by the Research Ring at The ALERRT Center, Texas State University"
    right: 
      - icon: github
        href: "https://github.com/ALERRT-Research/PROJ_activeattack_website"

format:
  html:
    theme:
      light: flatly
      dark: [darkly, aa-dark.scss]
    css: [aa-theme.css, styles.css]
    include-in-header: aa-head.html
    toc: true
    
